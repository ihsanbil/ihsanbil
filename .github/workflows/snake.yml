name: Generate Snake Animation

on:
  schedule:
    # Refresh the contribution animation twice a day.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: profile-output-assets
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout current output assets
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: output
          path: current-output

      - name: Prepare assets directory
        run: |
          mkdir -p dist
          if [ -d current-output ]; then
            find current-output -mindepth 1 -maxdepth 1 ! -name '.git' -exec cp -R {} dist/ \;
          fi

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3.4.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
