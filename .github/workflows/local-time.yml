name: Update Local Time Badge

on:
  schedule:
    # GitHub Actions schedules run in UTC; this refreshes the badge every 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6

      - name: Checkout current output assets
        uses: actions/checkout@v6
        with:
          ref: output
          path: current-output

      - name: Prepare assets directory
        run: |
          mkdir -p dist
          find current-output -mindepth 1 -maxdepth 1 ! -name '.git' -exec cp -R {} dist/ \;

      - name: Render local time badge
        run: |
          TIME="$(TZ=Asia/Jakarta date '+%H:%M')"
          cat > dist/local-time.svg <<EOF
          <svg width="184" height="36" viewBox="0 0 184 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="0.5" y="0.5" width="183" height="35" rx="17.5" fill="#0D1117" stroke="#30363D"/>
            <circle cx="18" cy="18" r="4" fill="#58A6FF"/>
            <text x="30" y="22" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="1">JAKARTA</text>
            <text x="104" y="23" fill="#F0F6FC" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700">$TIME</text>
            <text x="157" y="22" fill="#58A6FF" font-family="Segoe UI, Arial, sans-serif" font-size="12">WIB</text>
          </svg>
          EOF

      - name: Push assets to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
